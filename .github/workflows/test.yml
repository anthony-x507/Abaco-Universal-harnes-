name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test extras
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -e ".[dev,desktop]"
      - name: Pytest
        run: python3 -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and test SPA
        working-directory: web
        run: |
          bun install
          bun run test
